services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: regulens
      POSTGRES_PASSWORD: regulens
      POSTGRES_DB: regulens
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regulens"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
