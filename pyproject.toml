[project]
name = "regulens"
version = "0.1.0"
description = "Bilingual QA over Canadian financial-regulation documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "pydantic-settings>=2",
    "psycopg[binary]>=3",
    "pgvector>=0.3",
    "pymupdf>=1.24",
    "sentence-transformers>=3",
    "anthropic>=0.40",
    "uvicorn>=0.30",
    "structlog>=24",
    "langdetect>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regulens"]

# ---------- ruff ----------
[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

# ---------- mypy ----------
[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["regulens"]
plugins = ["pydantic.mypy"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests that call an LLM (deselect with -m 'not llm')",
]
